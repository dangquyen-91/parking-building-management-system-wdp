  /sessions/{id}/checkout/preview:
    get:
      tags: [Sessions]
      summary: Preview checkout fee before collecting payment (admin, manager, staff)
      description: |
        Calculates fee for an active session WITHOUT closing it.
        - Resident (active subscription): fee = 0.
        - Walk-in: calculates fee based on active Pricing for the vehicleType.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
