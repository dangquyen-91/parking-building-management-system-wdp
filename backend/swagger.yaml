  /sessions/check-in:
    post:
      tags: [Sessions]
      summary: Check in a vehicle (admin, manager, staff)
      description: |
        Staff enters the license plate. The system auto-detects whether the plate has an active Subscription:
        - Has active Subscription → `customerType: resident`, `userId` filled from subscription owner, must use resident floor.
          For CAR resident, slot is auto-resolved from `subscription.slotId` — staff does NOT pass slotId.
        - No subscription → `customerType: walk_in`, must use visitor floor; fee charged at exit time.
          For CAR walk-in, slotId is REQUIRED.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Car check-in
                  type: object
                  required: [vehicleType, licensePlate]
                  properties:
                    vehicleType:
                      type: string
                      enum: [car]
                    licensePlate:
                      type: string
                      example: 51A-12345
                    slotId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                      description: Required for walk-in. Optional/auto-resolved for resident.
                    note:
                      type: string
                - title: Motorcycle check-in
                  type: object
                  required: [vehicleType, licensePlate, rowId]
                  properties:
                    vehicleType:
                      type: string
                      enum: [motorcycle]
                    licensePlate:
                      type: string
                      example: 59X1-23456
                    rowId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                    note:
                      type: string
      responses:
        '201':
          description: Vehicle checked in â€” slot assigned, session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Vehicle checked in successfully
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
        '400':
          description: Vehicle already has an active session
        '404':
          description: No available slots for the vehicle type
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

