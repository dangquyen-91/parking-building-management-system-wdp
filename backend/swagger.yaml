openapi: 3.0.3
info:
  title: Parking Building Management System API
  description: REST API for managing parking buildings, users, and bookings
  version: 1.0.0
  contact:
    name: WDP301 Team

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User management
  - name: Buildings
    description: Building management
  - name: Floors
    description: Floor management
  - name: Slots
    description: Parking slot management

# ─── Security Schemes ────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── Schemas ───────────────────────────────────────────────────────────────
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        phone:
          type: string
          example: '0901234567'
        role:
          type: string
          enum: [admin, manager, staff, user]
          example: user
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        password:
          type: string
          minLength: 6
          example: password123
        phone:
          type: string
          example: '0901234567'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        password:
          type: string
          example: password123

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UpdateMeRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van B
        phone:
          type: string
          example: '0901234567'

    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van B
        email:
          type: string
          format: email
          example: nguyenvanb@gmail.com
        phone:
          type: string
          example: '0901234567'

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, manager, staff, user]
          example: staff

    UpdateStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
          example: false

    TokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    PaginatedUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          example: 42

    Building:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        name:
          type: string
          example: Toa nha A
        address:
          type: string
          example: 123 Nguyen Van Linh, Da Nang
        description:
          type: string
          example: Toa nha van phong 10 tang
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedBuildings:
      type: object
      properties:
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/Building'
        total:
          type: integer
          example: 5
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10

    Floor:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        buildingId:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
              example: Toa nha A
            address:
              type: string
              example: 123 Nguyen Van Linh, Da Nang
        floorNumber:
          type: integer
          example: 1
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        totalSlots:
          type: integer
          example: 50
        description:
          type: string
          example: Tang 1 danh cho xe may
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingSlot:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        floorId:
          type: object
          properties:
            _id:
              type: string
            floorNumber:
              type: integer
              example: 1
            vehicleType:
              type: string
              example: motorcycle
        slotCode:
          type: string
          example: F1-001
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        status:
          type: string
          enum: [empty, occupied, reserved, maintenance]
          example: empty
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  # ─── Reusable Responses ────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: No token provided
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: You do not have permission to perform this action
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: User not found
    ValidationError:
      description: Invalid request body
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: '"role" must be one of [admin, manager, staff, user]'

# ─── Paths ───────────────────────────────────────────────────────────────────
paths:

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Registration successful
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Email already in use or validation error

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    allOf:
                      - $ref: '#/components/schemas/TokensResponse'
                      - type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Get a new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/TokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Users ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Users]
      summary: Update current user profile (fullName, phone only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Get all users (admin, manager)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, manager, staff, user]
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [fullName, email, createdAt, role]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Users retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=30
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (admin, manager)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=30
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Users]
      summary: Update user info (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change user role (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User deactivated
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Buildings ────────────────────────────────────────────────────────────────
  /buildings:
    get:
      tags: [Buildings]
      summary: Get all buildings (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, address, createdAt]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Buildings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/PaginatedBuildings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Buildings]
      summary: Create a new building (admin, manager)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name:
                  type: string
                  example: Toa nha A
                address:
                  type: string
                  example: 123 Nguyen Van Linh, Da Nang
                description:
                  type: string
                  example: Toa nha van phong 10 tang
      responses:
        '201':
          description: Building created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      building:
                        $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /buildings/{id}:
    get:
      tags: [Buildings]
      summary: Get a building by ID (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Building retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      building:
                        $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Buildings]
      summary: Update a building (admin, manager)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Toa nha A (updated)
                address:
                  type: string
                  example: 456 Le Duan, Da Nang
                description:
                  type: string
      responses:
        '200':
          description: Building updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      building:
                        $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Buildings]
      summary: Deactivate a building (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Building deactivated
        '400':
          description: Building still has active floors
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Floors ───────────────────────────────────────────────────────────────────
  /floors:
    get:
      tags: [Floors]
      summary: Get all floors (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: buildingId
          schema:
            type: string
          description: Filter by building
        - in: query
          name: vehicleType
          schema:
            type: string
            enum: [motorcycle, car]
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [floorNumber, vehicleType, createdAt]
            default: floorNumber
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Floors retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      floors:
                        type: array
                        items:
                          $ref: '#/components/schemas/Floor'
                      total:
                        type: integer
                        example: 5
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Floors]
      summary: Create a new floor (admin, manager)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildingId, floorNumber, vehicleType, totalSlots]
              properties:
                buildingId:
                  type: string
                  example: 664a1f2e8b2c3d4e5f6a7b8c
                floorNumber:
                  type: integer
                  example: 1
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                  example: motorcycle
                totalSlots:
                  type: integer
                  example: 50
                description:
                  type: string
                  example: Tang 1 danh cho xe may
      responses:
        '201':
          description: Floor created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      floor:
                        $ref: '#/components/schemas/Floor'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /floors/{id}:
    get:
      tags: [Floors]
      summary: Get a floor by ID with slot stats (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Floor retrieved with slot statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      floor:
                        allOf:
                          - $ref: '#/components/schemas/Floor'
                          - type: object
                            properties:
                              slotStats:
                                type: object
                                properties:
                                  empty:
                                    type: integer
                                    example: 30
                                  occupied:
                                    type: integer
                                    example: 15
                                  reserved:
                                    type: integer
                                    example: 3
                                  maintenance:
                                    type: integer
                                    example: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Floors]
      summary: Update a floor (admin, manager)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                floorNumber:
                  type: integer
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                totalSlots:
                  type: integer
                description:
                  type: string
      responses:
        '200':
          description: Floor updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Floors]
      summary: Deactivate a floor (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Floor deactivated
        '400':
          description: Floor still has parking slots
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Slots ────────────────────────────────────────────────────────────────────
  /slots:
    get:
      tags: [Slots]
      summary: Get all slots (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: floorId
          schema:
            type: string
          description: Filter by floor
        - in: query
          name: status
          schema:
            type: string
            enum: [empty, occupied, reserved, maintenance]
        - in: query
          name: vehicleType
          schema:
            type: string
            enum: [motorcycle, car]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Slots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      slots:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParkingSlot'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Slots]
      summary: Create a single slot (admin, manager)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, slotCode]
              properties:
                floorId:
                  type: string
                slotCode:
                  type: string
                  example: F1-001
                note:
                  type: string
      responses:
        '201':
          description: Slot created
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /slots/bulk:
    post:
      tags: [Slots]
      summary: Bulk create slots for a floor with auto-generated codes (admin, manager)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, quantity]
              properties:
                floorId:
                  type: string
                  example: 664a1f2e8b2c3d4e5f6a7b8c
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 200
                  example: 50
      responses:
        '201':
          description: Slots created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 50
                      slots:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParkingSlot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /slots/{id}:
    get:
      tags: [Slots]
      summary: Get a slot by ID (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Slot retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      slot:
                        $ref: '#/components/schemas/ParkingSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Slots]
      summary: Update slot status or note (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [empty, occupied, reserved, maintenance]
                note:
                  type: string
      responses:
        '200':
          description: Slot updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Slots]
      summary: Delete a slot (admin, manager) — blocked if occupied
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Slot deleted
        '400':
          description: Cannot delete an occupied slot
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
