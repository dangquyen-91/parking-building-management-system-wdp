  /webhooks/payos:
    servers:
      - url: http://localhost:5000
        description: Webhook endpoint mounted outside /api/v1 to bypass rate limit
    post:
      tags: [Subscriptions]
      summary: PayOS webhook callback (NO auth — signature verified)
      description: |
        Called by PayOS after a payment attempt. Server verifies the HMAC signature using PAYOS_CHECKSUM_KEY.
        On success, the matching Subscription is activated (startDate=now, endDate=now+durationDays).
        Full URL: `http://localhost:5000/webhooks/payos` (note: NOT under `/api/v1`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayOSWebhookBody'
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  processed:
                    type: boolean
                  status:
                    type: string
                    enum: [activated, failed, paid_but_no_sub]
        '400':
          description: Invalid signature

  /bookings:
    post:
      tags: [Bookings]
      summary: Create a car booking (anonymous OR logged-in)
      description: |
        Walk-in car booking. Anyone (logged-in or anonymous) can book.
        - Only `car`, on visitor floor.
        - Pre-pay = durationHours × 20,000đ, cap 120,000đ per 24h.
        - Capacity check is time-based: counts overlapping bookings + (if today) current active sessions.
        - Booking can be made up to 24 hours in advance.
        - Min 1h, max 24h duration.
        - No-show grace: until `expectedExitTime`, then expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created, awaiting payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreateBookingResponse'
        '400':
          description: Validation error (time out of range, plate has active session, etc)
        '409':
          description: No availability OR plate has overlapping booking
        '502':
          description: PayOS error
    get:
