  /reports/revenue:
    get:
      tags: [Reports]
      summary: Revenue breakdown by period (admin, manager)
      description: |
        Revenue grouped by source and aggregated by day / week / month.
        Defaults to last 30 days grouped by day.

        **Revenue sources:**
        - `subscription` – resident plan purchases (via PayOS)
        - `booking` – pre-paid walk-in car bookings (via PayOS)
        - `sessionTransfer` – PayOS payment at exit
        - `sessionCash` – cash collected at exit
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date, example: '2026-05-01' }
        - in: query
          name: to
          schema: { type: string, format: date, example: '2026-05-31' }
        - in: query
          name: groupBy
          schema: { type: string, enum: [day, week, month], default: day }
          description: Aggregate periods by day (YYYY-MM-DD), week (YYYY-Www), or month (YYYY-MM)
      responses:
        '200':
          description: Revenue report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      groupBy: { type: string, enum: [day, week, month] }
                      totals:
                        type: object
                        properties:
                          subscription: { type: integer }
                          booking: { type: integer }
                          sessionTransfer: { type: integer }
                          sessionCash: { type: integer }
                          total: { type: integer }
                          transactions: { type: integer }
                      periods:
                        type: array
                        items:
                          type: object
                          properties:
                            period: { type: string, example: '2026-05-01' }
                            subscription: { type: integer }
                            booking: { type: integer }
                            sessionTransfer: { type: integer }
                            sessionCash: { type: integer }
                            total: { type: integer }
                            transactions: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

