        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/checkout/preview:
    get:
      tags: [Sessions]
      summary: Preview checkout fee before collecting payment (admin, manager, staff)
      description: |
        Calculates fee for an active session WITHOUT closing it.
        - Resident (active subscription): fee = 0.
        - Walk-in: calculates fee based on active Pricing for the vehicleType.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      customerType:
                        type: string
                        enum: [resident, walk_in]
                      entryTime:
                        type: string
                        format: date-time
                      exitTime:
                        type: string
                        format: date-time
                      fee:
                        type: integer
                        example: 25000
                      breakdown:
                        type: object
                        nullable: true
                        properties:
                          durationMs:
                            type: integer
                          turns:
                            type: integer
                          hours:
                            type: integer
                          nights:
                            type: integer
                          baseFee:
                            type: integer
                          overnightFee:
                            type: integer
                          cappedAt:
                            type: integer
                            nullable: true
                      pricing:
                        type: object
                        nullable: true
        '400':
          description: Session is already completed or cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/checkout/cash:
    post:
      tags: [Sessions]
      summary: Complete checkout with CASH payment (admin, staff)
      description: |
        Staff confirms they have collected cash from the driver.
        Calculates final fee, marks session as completed + paid, releases slot/row immediately.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session closed; slot/row released
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
        '400':
          description: Session is not active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/checkout/transfer:
    post:
      tags: [Sessions]
      summary: Create PayOS payment link for TRANSFER checkout (admin, staff)
      description: |
        Calculates fee, creates a PayOS payment link, returns checkoutUrl + QR.
        Session stays `active` with `paymentStatus: pending` until the PayOS webhook arrives.
        On webhook success the session is auto-closed + slot/row released.
        Resident sessions skip PayOS — they are closed immediately with fee=0.
        If a pending payment already exists, the same link is reused.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PayOS link created (or reused) — driver scans QR to pay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
                      payment:
                        type: object
                        nullable: true
                        properties:
                          orderCode:
                            type: integer
                          amount:
                            type: integer
                          checkoutUrl:
                            type: string
                            example: https://pay.payos.vn/web/xxxxxxxx
                          paymentLinkId:
                            type: string
                          qrCode:
                            type: string
                          accountNumber:
                            type: string
                          accountName:
                            type: string
                          bin:
                            type: string
                      fee:
                        type: integer
                      breakdown:
                        type: object
        '400':
          description: Session is not active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: PayOS API error

  /parking-rows:
    get:
      tags: [Parking Rows]
      summary: Get all parking rows (motorcycle floors only)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: floorId
          schema:
            type: string
        - in: query
          name: buildingId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [available, full, maintenance]
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [rowCode, capacity, occupiedCount, status, createdAt]
            default: rowCode
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Rows retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParkingRow'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Parking Rows]
      summary: Create a parking row on a motorcycle floor (admin, manager)
      description: >
        Tạo hàng xe máy trên tầng motorcycle.
        Tổng capacity của tất cả hàng không được vượt quá `totalSlots` của tầng.
        Ví dụ: floor `totalSlots = 50`, đã có R01 `capacity = 30` → R02 chỉ được tối đa `capacity = 20`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, rowCode, capacity]
              properties:
                floorId:
                  type: string
                  example: 664a1f2e8b2c3d4e5f6a7b8c
                rowCode:
                  type: string
                  example: R01
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 500
                  example: 20
                  description: Số chỗ đỗ xe máy trong hàng này. Tổng capacity các hàng ≤ floor.totalSlots.
                note:
                  type: string
      responses:
        '201':
          description: Row created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      row:
                        $ref: '#/components/schemas/ParkingRow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Floor capacity exceeded — tổng capacity các hàng vượt quá floor.totalSlots
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  message:
                    type: string
                    example: 'Floor capacity exceeded. Used: 30, adding: 25, max: 50'

  /parking-rows/{id}:
    get:
      tags: [Parking Rows]
      summary: Get a parking row by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Row retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      row:
                        $ref: '#/components/schemas/ParkingRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Parking Rows]
      summary: Update a parking row (admin, manager)
      description: >
        Cập nhật thông tin hàng xe máy.
        Khi thay đổi `capacity`: không được nhỏ hơn số xe đang đậu (`occupiedCount`),
        và tổng capacity các hàng còn lại + capacity mới không được vượt `floor.totalSlots`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rowCode:
                  type: string
                  example: R01
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 500
                  description: Tổng capacity các hàng (trừ hàng này) + capacity mới ≤ floor.totalSlots.
                note:
                  type: string
      responses:
        '200':
          description: Row updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            Capacity conflict — either below occupiedCount or total exceeds floor.totalSlots
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  message:
                    type: string
                    example: 'Floor capacity exceeded. Other rows: 40, updating to: 15, max: 50'

    delete:
      tags: [Parking Rows]
      summary: Delete a parking row (admin) — blocked if has active session
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Row deleted
        '409':
          description: Cannot delete row with an active parking session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

