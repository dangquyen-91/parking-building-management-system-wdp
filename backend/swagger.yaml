                            type: integer
                          turns:
                            type: integer
                          hours:
                            type: integer
                          nights:
                            type: integer
                          baseFee:
                            type: integer
                          overnightFee:
                            type: integer
                          cappedAt:
                            type: integer
                            nullable: true
                      pricing:
                        type: object
                        nullable: true
        '400':
