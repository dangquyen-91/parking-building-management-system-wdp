        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/checkout/cash:
    post:
      tags: [Sessions]
      summary: Complete checkout with CASH payment (admin, staff)
      description: |
        Staff confirms they have collected cash from the driver.
        Calculates final fee, marks session as completed + paid, releases slot/row immediately.

        **Bắt buộc QR khớp camera** — áp dụng cho cả resident và walk-in:
        - `qrToken` phải byte-for-byte đúng QR đang gắn với session này (QR gói của
          subscription cho resident, hoặc vé `walkin_ticket` đã lưu lúc check-in cho walk-in).
        - Biển số mã hoá trong `qrToken` phải khớp `scannedPlate` (camera đọc tại cổng ra).
        - Sai bất kỳ điểm nào → 400, KHÔNG đóng session.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken, scannedPlate]
              properties:
                qrToken:
                  type: string
                  description: QR đã nhận lúc check-in (QR gói hoặc vé walk-in) — dùng lại nguyên vẹn
                  example: eyJ0eXBlIjoid2Fsa2luX3RpY2tldCIsInBsYXRlIjoiNTFBMTIzNDUiLCJpYXQiOjE2OTAwMDAwMDB9.abc123
                scannedPlate:
                  type: string
                  description: Biển số camera quét được tại cổng ra
                  example: 51A12345
      responses:
        '200':
          description: Session closed; slot/row released
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
        '400':
          description: >
            Session is not active, OR qrToken không hợp lệ/không khớp session/biển số
            camera không khớp QR.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/checkout/transfer:
    post:
      tags: [Sessions]
      summary: Create PayOS payment link for TRANSFER checkout (admin, staff)
      description: |
        Calculates fee, creates a PayOS payment link, returns checkoutUrl + QR.
        Session stays `active` with `paymentStatus: pending` until the PayOS webhook arrives.
        On webhook success the session is auto-closed + slot/row released.
        Resident sessions skip PayOS — they are closed immediately with fee=0.
        If a pending payment already exists, the same link is reused.

        **Bắt buộc QR khớp camera** (giống `/checkout/cash`) — xem mô tả bên đó.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken, scannedPlate]
              properties:
                qrToken:
                  type: string
                  description: QR đã nhận lúc check-in (QR gói hoặc vé walk-in) — dùng lại nguyên vẹn
                  example: eyJ0eXBlIjoid2Fsa2luX3RpY2tldCIsInBsYXRlIjoiNTFBMTIzNDUiLCJpYXQiOjE2OTAwMDAwMDB9.abc123
                scannedPlate:
                  type: string
                  description: Biển số camera quét được tại cổng ra
                  example: 51A12345
      responses:
        '200':
          description: PayOS link created (or reused) — driver scans QR to pay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
                      payment:
                        type: object
                        nullable: true
                        properties:
                          orderCode:
                            type: integer
                          amount:
                            type: integer
                          checkoutUrl:
                            type: string
                            example: https://pay.payos.vn/web/xxxxxxxx
                          paymentLinkId:
                            type: string
                          qrCode:
                            type: string
                          accountNumber:
                            type: string
                          accountName:
                            type: string
                          bin:
                            type: string
                      fee:
                        type: integer
                      breakdown:
                        type: object
        '400':
          description: >
            Session is not active, OR qrToken không hợp lệ/không khớp session/biển số
            camera không khớp QR.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: PayOS API error

  /sessions/{id}/checkout/confirm:
    post:
      tags: [Sessions]
      summary: Confirm a transfer checkout now — close session without waiting for the webhook (admin, staff)
      description: |
        After a TRANSFER checkout link is paid, actively queries PayOS instead of waiting for
        the (5-15s delayed) webhook. If PayOS reports PAID, the session is closed immediately
        (status=completed, slot/row released). Idempotent and safe vs. the webhook racing in
        parallel. Intended for the return-url flow on the staff checkout screen.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Returns the (possibly now-completed) session. If PayOS has not registered the
            payment yet, the session stays `active` with `paymentStatus: pending` — retry shortly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Session or its payment not found
        '502':
          description: PayOS API error

  /parking-rows:
