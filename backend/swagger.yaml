  /reports/revenue/comparison:
    get:
      tags: [Reports]
      summary: Revenue comparison current vs previous period (admin, manager)
      description: |
        Compares total revenue between the **current** period and the **previous** same-length period.
        Returns absolute values, change percentage, and trend direction.

        | period | Current | Previous |
        |--------|---------|----------|
        | `week` | Mon–today | previous Mon–Sun |
        | `month` | 1st–today | entire previous month |
        | `year` | Jan 1–today | entire previous year |
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [week, month, year], default: month }
      responses:
        '200':
          description: Revenue comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period: { type: string, enum: [week, month, year] }
                      current:
                        type: object
                        properties:
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          subscription: { type: integer }
                          booking: { type: integer }
                          sessionTransfer: { type: integer }
                          sessionCash: { type: integer }
                          total: { type: integer }
                          transactions: { type: integer }
                      previous:
                        type: object
                        properties:
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          total: { type: integer }
                          transactions: { type: integer }
                      changePercent: { type: number, example: 19.5, nullable: true }
                      trend: { type: string, enum: [up, down, flat, no_data] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

