              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      licensePlate:
                        type: string
                        example: 51A12345
                      qrToken:
                        type: string
                      qrImage:
                        type: string
                        description: Base64 PNG — dùng trực tiếp trong thẻ img
                        example: data:image/png;base64,iVBORw0KGgoAAAANSUh...
        '400':
          description: Session không còn active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
