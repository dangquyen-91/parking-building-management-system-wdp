  /slots/available-for-subscription:
    get:
      tags: [Slots]
      summary: Get availability for resident subscription (any role)
      description: |
        - `vehicleType=car`: returns slots grouped by floor (slot picker UI).
        - `vehicleType=motorcycle`: returns capacity summary (no individual slots — moto subs
          do not lock a slot, only access to the resident floor).
        Available to all authenticated users.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: vehicleType
          schema:
            type: string
            enum: [car, motorcycle]
            default: car
        - in: query
          name: buildingId
          schema:
            type: string
          description: Filter by specific building (optional)
      responses:
        '200':
          description: Availability info
          content:
            application/json:
              schema:
                oneOf:
                  - title: Car (slot picker)
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicleType:
                            type: string
                            example: car
                          floors:
                            type: array
                            items:
                              type: object
                              properties:
                                floor:
                                  type: object
                                  properties:
                                    _id:
                                      type: string
                                    floorNumber:
                                      type: integer
                                      example: -2
                                    description:
                                      type: string
                                    totalSlots:
                                      type: integer
                                    building:
                                      type: object
                                slots:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      _id:
                                        type: string
                                      slotCode:
                                        type: string
                                        example: BC2-01
                                      status:
                                        type: string
                                        enum: [empty, occupied, reserved, maintenance]
                                      available:
                                        type: boolean
                                availableCount:
                                  type: integer
                                  example: 28
                  - title: Motorcycle (capacity summary)
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicleType:
                            type: string
                            example: motorcycle
                          totalCapacity:
                            type: integer
                            example: 100
                          soldCount:
                            type: integer
                            example: 23
                          availableCount:
                            type: integer
                            example: 77
                          floors:
                            type: array
                            items:
                              type: object
                          note:
                            type: string
        '400':
          description: Invalid vehicleType
        '401':
          $ref: '#/components/responses/Unauthorized'

  /slots:
    get:
      tags: [Slots]
      summary: Get all slots (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: floorId
          schema:
            type: string
          description: Filter by floor
        - in: query
          name: buildingId
          schema:
            type: string
          description: Filter by building
        - in: query
          name: status
          schema:
            type: string
            enum: [empty, occupied, reserved, maintenance]
        - in: query
          name: vehicleType
          schema:
            type: string
            enum: [motorcycle, car]
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [slotCode, vehicleType, status, createdAt]
            default: slotCode
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Slots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      slots:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParkingSlot'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Slots]
      summary: Create a single slot (admin, manager)
      description: >
        Tạo slot ô tô đơn lẻ. Chỉ áp dụng cho floor có `vehicleType: car`.
        Xe máy dùng `POST /parking-rows` thay thế.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, slotCode, vehicleType]
              properties:
                floorId:
                  type: string
                  example: 664a1f2e8b2c3d4e5f6a7b8c
                  description: ID của floor có vehicleType là car
                slotCode:
                  type: string
                  example: A01
                vehicleType:
                  type: string
                  enum: [car]
                  example: car
                  description: Luôn phải là "car" — slot chỉ tồn tại trên car floor
                note:
                  type: string
      responses:
        '201':
          description: Slot created
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /slots/bulk:
    post:
      tags: [Slots]
      summary: Bulk create slots — auto-generate by quantity or explicit list (admin, manager)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Auto-generate by quantity
                  type: object
                  required: [floorId, quantity]
                  properties:
                    floorId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                    quantity:
                      type: integer
                      minimum: 1
                      maximum: 200
                      example: 10
                    prefix:
                      type: string
                      example: A
                      default: A
                    startFrom:
                      type: integer
                      minimum: 1
                      example: 1
                - title: Explicit slot list
                  type: object
                  required: [floorId, slots]
                  properties:
                    floorId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                      description: ID của floor có vehicleType là car
                    slots:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items:
                        type: object
                        required: [slotCode]
                        properties:
                          slotCode:
                            type: string
                            example: A01
                          note:
