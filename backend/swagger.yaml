      description: |
        Actively queries PayOS for the latest payment status instead of waiting for the
        (5-15s delayed) webhook. If PayOS reports PAID, the subscription is activated
        immediately (status=active, startDate/endDate set, qrToken minted — for both car
        and motorcycle plans). Fully idempotent: safe to call repeatedly and safe vs. the
