                        type: integer
                      totalPages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Parking Rows]
      summary: Create a parking row on a motorcycle floor (admin, manager)
      description: >
        Tạo hàng xe máy trên tầng motorcycle.
        Tổng capacity của tất cả hàng không được vượt quá `totalSlots` của tầng.
        Ví dụ: floor `totalSlots = 50`, đã có R01 `capacity = 30` → R02 chỉ được tối đa `capacity = 20`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, rowCode, capacity]
              properties:
                floorId:
                  type: string
                  example: 664a1f2e8b2c3d4e5f6a7b8c
                rowCode:
                  type: string
                  example: R01
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 500
                  example: 20
                  description: Số chỗ đỗ xe máy trong hàng này. Tổng capacity các hàng ≤ floor.totalSlots.
                note:
                  type: string
      responses:
        '201':
          description: Row created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      row:
                        $ref: '#/components/schemas/ParkingRow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Floor capacity exceeded — tổng capacity các hàng vượt quá floor.totalSlots
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  message:
                    type: string
                    example: 'Floor capacity exceeded. Used: 30, adding: 25, max: 50'

  /parking-rows/{id}:
    get:
      tags: [Parking Rows]
      summary: Get a parking row by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Row retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      row:
                        $ref: '#/components/schemas/ParkingRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Parking Rows]
      summary: Update a parking row (admin, manager)
      description: >
        Cập nhật thông tin hàng xe máy.
        Khi thay đổi `capacity`: không được nhỏ hơn số xe đang đậu (`occupiedCount`),
        và tổng capacity các hàng còn lại + capacity mới không được vượt `floor.totalSlots`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rowCode:
                  type: string
                  example: R01
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 500
                  description: Tổng capacity các hàng (trừ hàng này) + capacity mới ≤ floor.totalSlots.
                note:
                  type: string
      responses:
        '200':
          description: Row updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            Capacity conflict — either below occupiedCount or total exceeds floor.totalSlots
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  message:
                    type: string
                    example: 'Floor capacity exceeded. Other rows: 40, updating to: 15, max: 50'

    delete:
      tags: [Parking Rows]
      summary: Delete a parking row (admin) — blocked if has active session
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Row deleted
        '409':
          description: Cannot delete row with an active parking session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

