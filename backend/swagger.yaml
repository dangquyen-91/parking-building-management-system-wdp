  /slots/bulk:
    post:
      tags: [Slots]
      summary: Bulk create slots — auto-generate by quantity or explicit list (admin, manager)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Auto-generate by quantity
                  type: object
                  required: [floorId, quantity]
                  properties:
                    floorId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                    quantity:
                      type: integer
                      minimum: 1
                      maximum: 200
                      example: 10
                    prefix:
                      type: string
                      example: A
                      default: A
                    startFrom:
                      type: integer
                      minimum: 1
                      example: 1
                - title: Explicit slot list
                  type: object
                  required: [floorId, slots]
                  properties:
                    floorId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                    slots:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items:
                        type: object
                        required: [slotCode]
                        properties:
                          slotCode:
                            type: string
                            example: A01
                          vehicleType:
                            type: string
                            enum: [motorcycle, car]
                          note:
