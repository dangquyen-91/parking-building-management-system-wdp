        '200':
          description: Booking detail
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{id}/cancel:
    patch:
      tags: [Bookings]
      summary: Cancel a pending booking (owner only)
      description: |
        Cancel a pending booking. Paid bookings cannot be cancelled (no refund).
        - Logged-in user: cancels their own bookings.
        - Anonymous (guest): must provide email + licensePlate in body for verification.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Required for anonymous (guest) booking
                licensePlate:
                  type: string
                  description: Required for anonymous (guest) booking
      responses:
        '200':
          description: Booking cancelled
        '400':
          description: Cannot cancel paid/used/expired booking
        '403':
          description: Not the owner / wrong verification info
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{id}/confirm:
    post:
      tags: [Bookings]
      summary: Confirm payment now — flip pending → paid without waiting for the webhook
      description: |
        Actively queries PayOS instead of waiting for the (5-15s delayed) webhook. If PayOS
        reports PAID, the booking is marked paid immediately and a confirmation email is sent.
        Idempotent and safe vs. the webhook racing in parallel. Intended for the return-url flow.
        - Logged-in user: confirms their own booking.
        - Anonymous (guest): must provide email + licensePlate in body for verification.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Required for anonymous (guest) booking
                licensePlate:
                  type: string
                  description: Required for anonymous (guest) booking
      responses:
        '200':
          description: |
            Returns the (possibly now-paid) booking. If PayOS has not registered the payment
            yet, the booking stays `pending` — retry shortly.
        '403':
          description: Not the owner / wrong verification info
        '404':
          description: Booking or its payment not found
        '502':
          description: PayOS API error

