        Dùng khi khách mất QR hoặc staff cần in lại — KHÔNG sinh QR mới.
        - Resident → trả về QR cố định của subscription liên kết.
        - Walk-in → trả về đúng vé `walkin_ticket` đã lưu lúc check-in.
      security:
