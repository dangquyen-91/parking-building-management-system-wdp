  /sessions/entry-qr:
    post:
      tags: [Sessions]
      summary: Cấp vé QR tạm cho khách vãng lai tại cổng vào (admin, staff)
      description: |
        Bước 1 của check-in vãng lai: camera ANPR đọc biển số → hệ thống sinh 1 mã QR
        (`type: walkin_ticket`) mã hoá biển số đó.

        - Vé chỉ có hiệu lực **5 phút** để dùng ở bước `POST /sessions/check-in` tiếp theo.
        - Vé này KHÔNG bị thay thế bởi QR khác sau khi check-in — chính xác cái QR này sẽ
          được lưu lại trên session và phải dùng lại nguyên vẹn lúc checkout.
        - Resident (có subscription active) KHÔNG dùng endpoint này — họ dùng QR cố định
          của gói, lấy qua `GET /subscriptions/{id}/qr`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licensePlate]
              properties:
                licensePlate:
                  type: string
                  example: 51A-12345
      responses:
        '200':
          description: Vé QR tạm đã được cấp
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Entry ticket QR generated
                  data:
                    type: object
                    properties:
                      qrToken:
                        type: string
                        example: eyJ0eXBlIjoid2Fsa2luX3RpY2tldCIsInBsYXRlIjoiNTFBMTIzNDUiLCJpYXQiOjE2OTAwMDAwMDB9.abc123
                      qrImage:
                        type: string
                        description: Base64 PNG của QR code — dùng trực tiếp trong thẻ img
                        example: data:image/png;base64,iVBORw0KGgoAAAANSUh...
                      licensePlate:
                        type: string
                        example: 51A12345
        '400':
          description: Vehicle already has an active session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/check-in:
    post:
      tags: [Sessions]
      summary: Check in a vehicle (admin, staff)
      description: |
        Staff enters the license plate. The system auto-detects whether the plate has an active Subscription:
        - Has active Subscription → `customerType: resident`, `userId` filled from subscription owner, must use resident floor.
          For CAR resident, slot is auto-resolved from `subscription.slotId` — staff does NOT pass slotId.
        - No subscription → `customerType: walk_in`, must use visitor floor; fee charged at exit time.
          For CAR walk-in, slotId is REQUIRED.

        **`qrToken` is now REQUIRED for everyone**, and must encode the same plate the gate
        camera just read:
        - Resident → QR cố định của gói, lấy qua `GET /subscriptions/{id}/qr`.
        - Walk-in → vé tạm lấy qua `POST /sessions/entry-qr` (phải dùng trong vòng 5 phút).

        Nếu hợp lệ, QR này được lưu lại làm "vé chính thức" của session — dùng nguyên vẹn
        ở bước checkout, không sinh QR mới.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Car check-in
                  type: object
                  required: [vehicleType, licensePlate, qrToken]
                  properties:
                    vehicleType:
                      type: string
                      enum: [car]
                    licensePlate:
                      type: string
                      example: 51A-12345
                    qrToken:
                      type: string
                      description: QR gói (resident) hoặc vé tạm từ /sessions/entry-qr (walk-in)
                      example: eyJ0eXBlIjoic3Vic2NyaXB0aW9uX2VudHJ5Iiwic3VibCI6IjY2NGEx...
                    slotId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                      description: Required for walk-in. Optional/auto-resolved for resident.
                    note:
                      type: string
                - title: Motorcycle check-in
                  type: object
                  required: [vehicleType, licensePlate, rowId, qrToken]
                  properties:
                    vehicleType:
                      type: string
                      enum: [motorcycle]
                    licensePlate:
                      type: string
                      example: 59X1-23456
                    qrToken:
                      type: string
                      description: QR gói (resident) hoặc vé tạm từ /sessions/entry-qr (walk-in)
                    rowId:
                      type: string
                      example: 664a1f2e8b2c3d4e5f6a7b8c
                    note:
                      type: string
      responses:
        '201':
          description: Vehicle checked in — slot assigned, session created, QR attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Vehicle checked in successfully
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
                      qrToken:
                        type: string
                        description: >
                          Chính là qrToken đã gửi lên (QR gói cho resident, vé entry-qr cho
                          walk-in) — không phải QR mới sinh ra.
                        example: eyJ0eXBlIjoid2Fsa2luX3RpY2tldCIsInBsYXRlIjoiNTFBMTIzNDUiLCJpYXQiOjE2OTAwMDAwMDB9.abc123
                      qrImage:
                        type: string
                        description: Base64 PNG của QR code — dùng trực tiếp trong thẻ img
                        example: data:image/png;base64,iVBORw0KGgoAAAANSUh...
        '400':
          description: >
            Vehicle already has an active session, OR qrToken thiếu/sai loại/biển số không
            khớp camera/vé walk-in đã hết hạn 5 phút.
        '404':
          description: No available slots for the vehicle type
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/lookup:
    get:
      tags: [Sessions]
      summary: Lookup a license plate before check-in (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: licensePlate
          required: true
          schema:
            type: string
            example: 51A-12345
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      licensePlate:
                        type: string
                        example: 51A-12345
                      status:
                        type: string
                        enum: [already_active, available]
                        example: available
                      customerType:
                        type: string
                        enum: [resident, walk_in]
                        example: walk_in
                      activeSession:
                        nullable: true
                        $ref: '#/components/schemas/ParkingSession'
                      subscription:
                        nullable: true
                        type: object
                        properties:
                          _id:
                            type: string
                          plan:
                            $ref: '#/components/schemas/Plan'
                          owner:
                            $ref: '#/components/schemas/User'
                          startDate:
                            type: string
                            format: date-time
                          endDate:
                            type: string
                            format: date-time
                          vehicleType:
                            type: string
                            enum: [motorcycle, car]
                      hint:
                        type: object
                        properties:
                          lastVisit:
                            nullable: true
                            type: object
                            properties:
                              vehicleType:
                                type: string
                              entryTime:
                                type: string
                                format: date-time
                              exitTime:
                                type: string
                                format: date-time
                              fee:
                                type: number
                      availableSlots:
                        type: object
                        properties:
                          motorcycle:
                            type: integer
                            example: 12
                          car:
                            type: integer
                            example: 5
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/scan-plate:
    post:
      tags: [Sessions]
      summary: Quét biển số xe qua camera (admin, manager, staff)
      description: |
        Nhận ảnh chụp từ camera (base64), gọi Plate Recognizer ANPR API và trả về biển số gợi ý.
        Frontend dùng kết quả này để prefill ô nhập biển số trước khi staff xác nhận check-in.
        - `confidence >= 0.8` → tự động điền
        - `confidence < 0.8` → highlight vàng, yêu cầu staff xác nhận thủ công
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Ảnh biển số dạng base64 (có thể kèm data URL prefix)
                  example: data:image/jpeg;base64,/9j/4AAQSkZJRgAB...
      responses:
        '200':
          description: Kết quả nhận dạng biển số
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: License plate detected
                  data:
                    type: object
                    properties:
                      result:
                        nullable: true
                        type: object
                        properties:
                          plate:
                            type: string
                            example: 51A12345
                          confidence:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 1
                            example: 0.92
                          region:
                            type: string
                            nullable: true
                            example: vn
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: ANPR service không phản hồi
        '503':
          description: ANPR service chưa được cấu hình (thiếu PLATE_RECOGNIZER_TOKEN)

  /sessions/verify-qr:
    post:
      tags: [Sessions]
      summary: Xác thực QR tại cổng ra (admin, manager, staff)
      description: |
        Bước xác thực TUỲ CHỌN trước khi checkout (chỉ để staff xem trước cảnh báo —
        không bắt buộc, vì checkout/cash|transfer tự verify lại từ đầu).
        - Verify chữ ký HMAC của token
        - Nhận diện loại QR: `subscription_entry` (resident, tìm session active theo
          subscriptionId) hoặc `walkin_ticket` (walk-in, tìm session active có
          `qrToken` khớp chính xác chuỗi này)
        - So khớp biển số trong token với `scannedPlate`
        - Trả về thông tin session + preview phí để staff xử lý checkout

        Sau khi verify thành công, gọi tiếp `POST /sessions/{id}/checkout/cash` hoặc `/transfer` để hoàn tất
        (truyền lại đúng `qrToken` + `scannedPlate` này).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken, scannedPlate]
              properties:
                qrToken:
                  type: string
                  description: Token lấy từ QR code khách xuất trình
                  example: eyJzaWQiOiI2NjRhMWYyZSIsInBsYXRlIjoiNTFBMTIzNDUiLCJpYXQiOjE2OTAwMDAwMDB9.abc123
                scannedPlate:
                  type: string
                  description: Biển số camera quét được tại cổng ra
                  example: 51A12345
      responses:
        '200':
          description: QR hợp lệ — biển số khớp, có thể tiến hành checkout
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: QR verified — proceed to checkout
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/ParkingSession'
                      plateMatch:
                        type: boolean
                        description: true = biển số khớp hoàn toàn, false = có sai lệch cần staff xác nhận
                        example: false
                      plateQR:
                        type: string
                        description: Biển số lưu trong QR (từ lúc check-in)
                        example: 9H7060
                      plateCamera:
                        type: string
                        description: Biển số camera quét tại cổng ra
                        example: 99H77060
                      warning:
                        type: string
                        nullable: true
                        description: Khác null khi biển số không khớp — FE hiện cảnh báo cho staff xác nhận
                        example: "Biển số camera (99H77060) khác biển số QR (9H7060). Staff cần xác nhận thủ công."
                      preview:
                        type: object
                        description: Thông tin phí checkout
                        properties:
                          sessionId:
                            type: string
                          customerType:
                            type: string
                            enum: [resident, walk_in]
                          entryTime:
                            type: string
                            format: date-time
                          exitTime:
                            type: string
                            format: date-time
                          fee:
                            type: integer
                            example: 25000
                          toCollect:
                            type: integer
                            example: 25000
                          note:
                            type: string
        '400':
          description: QR token không hợp lệ (chữ ký sai, session không active)
        '404':
          description: Session không tồn tại
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions:
    get:
      tags: [Sessions]
      summary: Get sessions (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, completed, cancelled]
            default: active
          description: Lọc theo trạng thái phiên. Mặc định là active (xe đang trong bãi)
        - in: query
          name: vehicleType
          schema:
            type: string
            enum: [motorcycle, car]
        - in: query
          name: licensePlate
          schema:
            type: string
          description: Partial match
        - in: query
          name: floorId
          schema:
            type: string
          description: Filter by floor
        - in: query
          name: buildingId
          schema:
            type: string
          description: Filter by building
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Sessions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParkingSession'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

