openapi: 3.0.3
info:
  title: Parking Building Management System API
  description: REST API for managing parking buildings, users, and bookings
  version: 1.0.0
  contact:
    name: WDP301 Team

servers:
  - url: /api/v1
    description: Current server (auto-detected)
  - url: https://pbms-backend.onrender.com/api/v1
    description: Render production
  - url: http://localhost:5000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User management
  - name: Buildings
    description: Building management
  - name: Floors
    description: Floor management
  - name: Slots
    description: Parking slot management
  - name: Sessions
    description: Vehicle check-in and check-out
  - name: Parking Rows
    description: Motorcycle parking row management
  - name: Plans
    description: Subscription plans for residents
  - name: Subscriptions
    description: Resident subscription purchase via PayOS
  - name: Bookings
    description: Car parking booking for walk-in customers (anonymous or logged-in)
  - name: Reports
    description: Manager dashboard — revenue, occupancy, peak hours (admin/manager)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        phone:
          type: string
          example: '0901234567'
        role:
          type: string
          enum: [admin, manager, staff, user]
          example: user
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        password:
          type: string
          minLength: 6
          example: password123
        phone:
          type: string
          example: '0901234567'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        password:
          type: string
          example: password123

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UpdateMeRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van B
        phone:
          type: string
          example: '0901234567'

    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van B
        email:
          type: string
          format: email
          example: nguyenvanb@gmail.com
        phone:
          type: string
          example: '0901234567'

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, manager, staff, user]
          example: staff

    UpdateStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
          example: false

    TokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    PaginatedUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          example: 42

    Building:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        name:
          type: string
          example: Toa nha A
        address:
          type: string
          example: 123 Nguyen Van Linh, Da Nang
        description:
          type: string
          example: Toa nha van phong 10 tang
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedBuildings:
      type: object
      properties:
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/Building'
        total:
          type: integer
          example: 5
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10

    Floor:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        buildingId:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
              example: Toa nha A
            address:
              type: string
              example: 123 Nguyen Van Linh, Da Nang
        floorNumber:
          type: integer
          example: 1
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        floorType:
          type: string
          enum: [resident, visitor]
          example: resident
          description: >
            resident floors require a userId (linked resident) on check-in.
            visitor floors must NOT have a userId on check-in.
        totalSlots:
          type: integer
          example: 50
          description: >
            Max total capacity of this floor.
            For car floors: max number of individual parking slots.
            For motorcycle floors: max total motorcycle spots across all rows (sum of row capacities).
        description:
          type: string
          example: Tang 1 danh cho xe may
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingSlot:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        floorId:
          type: object
          properties:
            _id:
              type: string
            floorNumber:
              type: integer
              example: 1
            vehicleType:
              type: string
              example: motorcycle
        slotCode:
          type: string
          example: A01
        vehicleType:
          type: string
          enum: [car]
          example: car
          description: Slot chỉ tồn tại trên car floor — luôn là "car"
        status:
          type: string
          enum: [empty, occupied, reserved, maintenance]
          example: empty
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingRow:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        floorId:
          type: object
          properties:
            _id:
              type: string
            floorNumber:
              type: integer
              example: 1
            vehicleType:
              type: string
              example: motorcycle
        rowCode:
          type: string
          example: R01
        capacity:
          type: integer
          example: 20
        occupiedCount:
          type: integer
          example: 5
        status:
          type: string
          enum: [available, full, maintenance]
          example: available
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingSession:
      type: object
      properties:
        _id:
          type: string
          example: 664a1f2e8b2c3d4e5f6a7b8c
        slotId:
          nullable: true
          $ref: '#/components/schemas/ParkingSlot'
        rowId:
          nullable: true
          $ref: '#/components/schemas/ParkingRow'
        licensePlate:
          type: string
          example: 51A-12345
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        entryTime:
          type: string
          format: date-time
        exitTime:
          type: string
          format: date-time
          nullable: true
        fee:
          type: number
          example: 0
        staffId:
          type: object
          properties:
            _id:
              type: string
            fullName:
              type: string
              example: Nguyen Van Staff
            email:
              type: string
        userId:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            fullName:
              type: string
              example: Nguyen Van A
            phone:
              type: string
        status:
          type: string
          enum: [active, completed, cancelled]
          example: active
        note:
          type: string
        createdAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: No token provided
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: You do not have permission to perform this action
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: User not found
    ValidationError:
      description: Invalid request body
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: '"role" must be one of [admin, manager, staff, user]'

    Plan:
      type: object
      properties:
        _id:
          type: string
          example: 68a0b1c2d3e4f5a6b7c8d9e0
        code:
          type: string
          enum: [MOTO_MONTHLY, MOTO_QUARTERLY, CAR_MONTHLY, CAR_QUARTERLY]
          example: MOTO_MONTHLY
        name:
          type: string
          example: Xe máy - Gói tháng
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        durationDays:
          type: integer
          example: 30
        price:
          type: integer
          example: 150000
        description:
          type: string
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdatePlanRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        price:
          type: integer
          minimum: 0
        durationDays:
          type: integer
          minimum: 1
        description:
          type: string
        isActive:
          type: boolean

    Subscription:
      type: object
      properties:
        _id:
          type: string
        userId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/User'
        planId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Plan'
        licensePlate:
          type: string
          example: 59A-12345
        vehicleType:
          type: string
          enum: [motorcycle, car]
        slotId:
          nullable: true
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ParkingSlot'
          description: >
            Fixed parking slot for car subscriptions. Null for motorcycle subs.
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, active, expired, cancelled]
          example: pending
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PurchaseSubscriptionRequest:
      type: object
      required: [planId, licensePlate]
      properties:
        planId:
          type: string
          example: 68a0b1c2d3e4f5a6b7c8d9e0
        licensePlate:
          type: string
          minLength: 4
          maxLength: 20
          example: 59A-12345
        slotId:
          type: string
          example: 6a14155afdb8625aa398c428
          description: >
            Required for CAR subscriptions (fixed parking spot on resident floor).
            Forbidden for motorcycle subscriptions.

    SubscriptionPurchaseResponse:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
        payment:
          type: object
          properties:
            orderCode:
              type: integer
              example: 123456789012
            amount:
              type: integer
              example: 150000
            checkoutUrl:
              type: string
              example: https://pay.payos.vn/web/xxxxxxxx
            paymentLinkId:
              type: string
            qrCode:
              type: string
              description: EMVCo VietQR string
            accountNumber:
              type: string
            accountName:
              type: string
            bin:
              type: string

    PayOSWebhookBody:
      type: object
      description: Body sent by PayOS to /webhooks/payos. Signature is verified server-side.
      properties:
        code:
          type: string
          example: '00'
        desc:
          type: string
          example: success
        success:
          type: boolean
        data:
          type: object
          properties:
            orderCode:
              type: integer
            amount:
              type: integer
            description:
              type: string
            accountNumber:
              type: string
            reference:
              type: string
            transactionDateTime:
              type: string
            paymentLinkId:
              type: string
            code:
              type: string
            desc:
              type: string
        signature:
          type: string

    Booking:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
          example: guest@example.com
        licensePlate:
          type: string
          example: 51F-12345
        vehicleType:
          type: string
          enum: [car]
        expectedArrivalTime:
          type: string
          format: date-time
        expectedExitTime:
          type: string
          format: date-time
        durationHours:
          type: integer
          example: 3
        amount:
          type: integer
          example: 60000
        status:
          type: string
          enum: [pending, paid, used, expired, cancelled]
        paymentId:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true
          description: null if anonymous booking
        sessionId:
          type: string
          nullable: true
          description: set when matched to a session at check-in
        usedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required: [email, licensePlate, expectedArrivalTime, expectedExitTime]
      properties:
        email:
          type: string
          format: email
          example: guest@example.com
        licensePlate:
          type: string
          minLength: 4
          maxLength: 20
          example: 51F-12345
        expectedArrivalTime:
          type: string
          format: date-time
          example: '2026-06-01T08:00:00Z'
        expectedExitTime:
          type: string
          format: date-time
          example: '2026-06-01T11:00:00Z'

    CreateBookingResponse:
      type: object
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
        payment:
          type: object
          properties:
            orderCode:
              type: integer
            amount:
              type: integer
            checkoutUrl:
              type: string
            paymentLinkId:
              type: string
            qrCode:
              type: string
            accountNumber:
              type: string
            accountName:
              type: string
            bin:
              type: string

paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Registration successful
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Email already in use or validation error

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    allOf:
                      - $ref: '#/components/schemas/TokensResponse'
                      - type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Get a new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/TokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Users]
      summary: Update current user profile (fullName, phone only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Get all users (admin, manager)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, manager, staff, user]
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [fullName, email, createdAt, role]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Users retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=30
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (admin, manager)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=30
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Users]
      summary: Update user info (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change user role (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User deactivated
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings:
    get:
      tags: [Buildings]
      summary: Get all buildings (admin, manager, staff)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, address, createdAt]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
