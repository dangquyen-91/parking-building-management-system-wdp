      summary: Get availability for resident subscription (any role)
      description: |
        - `vehicleType=car`: returns slots grouped by floor (slot picker UI).
        - `vehicleType=motorcycle`: returns capacity summary (no individual slots — moto subs
          do not lock a slot, only access to the resident floor).
        Available to all authenticated users.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: vehicleType
          schema:
            type: string
            enum: [car, motorcycle]
            default: car
        - in: query
          name: buildingId
          schema:
            type: string
          description: Filter by specific building (optional)
      responses:
        '200':
          description: Availability info
          content:
            application/json:
              schema:
                oneOf:
                  - title: Car (slot picker)
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicleType:
                            type: string
                            example: car
                          floors:
                            type: array
                            items:
                              type: object
                              properties:
                                floor:
                                  type: object
                                  properties:
                                    _id:
                                      type: string
                                    floorNumber:
                                      type: integer
                                      example: -2
                                    description:
                                      type: string
                                    totalSlots:
                                      type: integer
                                    building:
                                      type: object
                                slots:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      _id:
                                        type: string
                                      slotCode:
                                        type: string
                                        example: BC2-01
                                      status:
                                        type: string
                                        enum: [empty, occupied, reserved, maintenance]
                                      available:
                                        type: boolean
                                availableCount:
                                  type: integer
                                  example: 28
                  - title: Motorcycle (capacity summary)
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicleType:
                            type: string
                            example: motorcycle
                          totalCapacity:
                            type: integer
                            example: 100
                          soldCount:
                            type: integer
                            example: 23
                          availableCount:
                            type: integer
                            example: 77
                          floors:
                            type: array
                            items:
                              type: object
                          note:
                            type: string
        '400':
          description: Invalid vehicleType
        '401':
          $ref: '#/components/responses/Unauthorized'

