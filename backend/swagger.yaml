    get:
      tags: [Subscriptions]
      summary: Lấy QR cố định của gói (chủ gói, hoặc admin/manager/staff)
      description: |
        Trả về QR token + ảnh QR base64 gắn với subscription này — sinh **một lần duy nhất**
        khi subscription chuyển `active` (lúc webhook PayOS báo thanh toán thành công), và
        KHÔNG đổi cho tới khi gói hết hạn/bị hủy.

        Resident dùng đúng QR này để check-in VÀ check-out trong suốt thời hạn gói — không
        có QR nào khác được sinh thêm.
        - User thường (`role: user`) chỉ xem được QR của gói thuộc về chính họ.
        - admin/manager/staff xem được QR của bất kỳ gói nào.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QR code trả về thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      qrToken:
                        type: string
                        example: eyJ0eXBlIjoic3Vic2NyaXB0aW9uX2VudHJ5Iiwic3ViSWQiOiI2NjRhMWYyZSIsInBsYXRlIjoiNTlBMTIzNDUiLCJpYXQiOjE2OTAwMDAwMDB9.abc123
                      qrImage:
                        type: string
                        description: Base64 PNG — dùng trực tiếp trong thẻ img
                        example: data:image/png;base64,iVBORw0KGgoAAAANSUh...
                      licensePlate:
                        type: string
                        example: 59A12345
                      subscriptionId:
                        type: string
        '400':
          description: Subscription chưa active (chưa thanh toán xong) nên chưa có QR
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: You can only view your own subscription QR
        '404':
          $ref: '#/components/responses/NotFound'

